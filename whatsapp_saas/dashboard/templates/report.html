<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .sub {
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
            color: #666;
        }

        .box {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 15px;
        }

        .label {
            font-weight: bold;
        }

        .insight {
            font-size: 14px;
            margin-top: 10px;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

<h1>Weekly Summary Report</h1>
<div class="sub">
    Business ID: {{ business_id }}<br>
    Week: {{ week_range }}
</div>

<div class="box">
    <div class="row">
        <span class="label">Total QR Scans</span>
        <span>{{ total_scans }}</span>
    </div>
    <div class="row">
        <span class="label">Feedback Received</span>
        <span>{{ feedback_count }}</span>
    </div>
    <div class="row">
        <span class="label">Positive Feedback</span>
        <span>{{ positive_feedback }}</span>
    </div>
    <div class="row">
        <span class="label">Positive Feedback Rate</span>
        <span>{{ positive_feedback_percentage }}%</span>
    </div>
</div>


<footer>
    Generated automatically 
</footer>

</body>
</html>
